<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Highest Number</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <h1>Highest Number</h1>
        <p>Choose the highest number to win.</p>
      </header>

      <section class="game-box">
        <div class="numbers">
          <button id="leftBtn" type="button"></button>
          <button id="rightBtn" type="button"></button>
        </div>

        <div id="result" class="result">Click a number to see if it is highest.</div>
        <button id="newRound" type="button" class="secondary">New round</button>
        <a class="link-button" href="{{ url_for('game.landing') }}">Back to hub</a>
      </section>
    </main>

    <script>
      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');
      const result = document.getElementById('result');
      const newRound = document.getElementById('newRound');

      function renderRound() {
        const a = Math.floor(Math.random() * 90) + 10;
        const b = Math.floor(Math.random() * 90) + 10;
        leftBtn.textContent = a;
        rightBtn.textContent = b;
        result.textContent = 'Pick the higher number.';
        leftBtn.disabled = false;
        rightBtn.disabled = false;
      }

      function evaluate(choice) {
        const left = Number(leftBtn.textContent);
        const right = Number(rightBtn.textContent);
        const winner = left > right ? leftBtn : rightBtn;
        if (choice === winner) {
          result.textContent = 'Correct! That was the highest number.';
          result.classList.add('success');
          result.classList.remove('failure');
        } else {
          result.textContent = 'Not quite — try again.';
          result.classList.add('failure');
          result.classList.remove('success');
        }
        leftBtn.disabled = true;
        rightBtn.disabled = true;
      }

      leftBtn.addEventListener('click', () => evaluate(leftBtn));
      rightBtn.addEventListener('click', () => evaluate(rightBtn));
      newRound.addEventListener('click', renderRound);
      renderRound();
    </script>
  </body>
</html>
