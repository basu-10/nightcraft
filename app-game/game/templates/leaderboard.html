<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      .lb-shell {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem;
      }
      .lb-tabs {
        display: flex;
        gap: 0.8rem;
        justify-content: center;
        margin-bottom: 1.5rem;
      }
      .lb-tab {
        padding: 0.6rem 1.4rem;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(2, 6, 23, 0.8);
        color: #e2e8f0;
        cursor: pointer;
        font-weight: 600;
      }
      .lb-tab.active {
        border-color: #38bdf8;
        box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
      }
      table.lb-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 14px;
        overflow: hidden;
      }
      .lb-table th,
      .lb-table td {
        padding: 0.7rem 0.9rem;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }
      .lb-table th {
        color: #94a3b8;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .lb-table td.rank { font-family: "Orbitron", sans-serif; color: #38bdf8; }
      .lb-table td.elo { font-weight: 700; }
      .lb-me { background: rgba(56, 189, 248, 0.1) !important; }
      .lb-empty { text-align: center; color: #94a3b8; padding: 2rem; }
      .hub-links { margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center; }
    </style>
  </head>
  <body class="game-hub">
    <div class="arcade-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="lb-shell">
      <header style="text-align: center; margin-bottom: 1.5rem;">
        <p class="hub-kicker">// NIGHTCRAFT ARCADE</p>
        <h1 class="hub-title" data-text="LEADERBOARD">LEADERBOARD</h1>
      </header>

      <div class="lb-tabs">
        <button class="lb-tab" data-game="tic_tac_toe" type="button">Tic-Tac-Toe</button>
        <button class="lb-tab" data-game="rock_paper_scissors" type="button">Rock Paper Scissors</button>
      </div>

      <div id="lbMe" class="lb-empty hidden"></div>
      <table class="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>ELO</th>
            <th>W</th>
            <th>L</th>
            <th>D</th>
          </tr>
        </thead>
        <tbody id="lbBody"></tbody>
      </table>

      <div class="hub-links">
        <a class="link-button" href="{{ url_for('game.landing') }}">Back to Hub</a>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/leaderboard.js') }}"></script>
    <script>
      Leaderboard.init({
        initialGame: {{ game_type | tojson }},
        dataUrl: "/game/leaderboard/data?game=",
      });
    </script>
  </body>
</html>
