<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      .room-shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem;
      }
      .scoreboard {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.18);
        margin-bottom: 1.5rem;
      }
      .score {
        font-size: 1.5rem;
        font-weight: 700;
      }
      .round-info {
        color: #94a3b8;
        font-size: 0.9rem;
        text-align: center;
      }
      .game-area {
        display: grid;
        gap: 1.5rem;
        padding: 1.5rem;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.18);
        justify-items: center;
      }
      .result-banner {
        text-align: center;
        padding: 1.5rem;
        border-radius: 14px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .result-banner.victory {
        background: rgba(34, 197, 94, 0.16);
        color: #a7f3d0;
      }
      .result-banner.defeat {
        background: rgba(248, 113, 113, 0.16);
        color: #fecaca;
      }
      .result-banner.draw {
        background: rgba(148, 163, 184, 0.16);
        color: #cbd5e1;
      }
      .room-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .hidden {
        display: none !important;
      }
      .waiting-text {
        color: #94a3b8;
        text-align: center;
        padding: 0.5rem;
      }
      .prompt {
        color: #e2e8f0;
        font-size: 1.05rem;
        margin-bottom: 0.5rem;
      }
      /* Tic-Tac-Toe board */
      .ttt-board {
        display: grid;
        grid-template-columns: repeat(3, 96px);
        grid-template-rows: repeat(3, 96px);
        gap: 10px;
      }
      .ttt-cell {
        font-family: "Orbitron", sans-serif;
        font-size: 2.6rem;
        font-weight: 900;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(2, 6, 23, 0.8);
        color: #e2e8f0;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.15s ease;
      }
      .ttt-cell:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 0 14px rgba(56, 189, 248, 0.55);
      }
      .ttt-cell:disabled {
        cursor: default;
      }
      .ttt-cell.cell-x {
        color: #38bdf8;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      }
      .ttt-cell.cell-o {
        color: #f472b6;
        text-shadow: 0 0 12px rgba(244, 114, 182, 0.8);
      }
      .ttt-cell.win {
        box-shadow: 0 0 18px rgba(163, 230, 53, 0.9);
        border-color: #a3e635;
      }
      /* Rock Paper Scissors */
      .choices {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .choice-btn {
        font-size: 1.1rem;
        min-width: 130px;
      }
      .choice-btn.selected {
        background: #38bdf8;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main class="room-shell">
      <div class="scoreboard">
        <div class="score" id="myScore">You: 0</div>
        <div class="round-info" id="roundInfo">Round 1</div>
        <div class="score" id="oppScore">Opponent: 0</div>
      </div>

      <div id="gameArea" class="game-area">
        <div id="prompt" class="prompt hidden"></div>
        <div id="tttBoard" class="ttt-board hidden"></div>
        <div id="rpsSection" class="hidden">
          <div class="choices">
            <button class="choice-btn" data-choice="rock" type="button" disabled>Rock</button>
            <button class="choice-btn" data-choice="paper" type="button" disabled>Paper</button>
            <button class="choice-btn" data-choice="scissors" type="button" disabled>Scissors</button>
          </div>
        </div>
        <div id="roundResult" class="hidden"></div>
      </div>

      <div id="gameOverSection" class="hidden">
        <div id="resultBanner" class="result-banner"></div>
        <p id="finalScore" style="text-align:center; margin-top:0.5rem; color:#94a3b8;"></p>
        <div class="room-actions">
          <button id="playAgainBtn" type="button">Play Again</button>
          <a class="link-button" href="{{ url_for('game.landing') }}">Back to Hub</a>
        </div>
      </div>

      <div class="room-actions" id="leaveActions">
        <button id="leaveBtn" class="secondary" type="button">Leave / Forfeit</button>
      </div>
    </main>

    <script>
      const RoomConfig = {
        roomId: {{ room_id | tojson }},
        gameType: {{ game_type | tojson }},
        userId: {{ user_id | tojson }},
        landingUrl: {{ url_for('game.landing') | tojson }},
        lobbyUrl: {{ url_for('game.lobby') | tojson }},
      };
    </script>
    <script src="{{ url_for('static', filename='js/room_core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tic_tac_toe_board.js') }}"></script>
    {% if game_type == 'tic_tac_toe' %}
    <script src="{{ url_for('static', filename='js/room_ttt.js') }}"></script>
    {% else %}
    <script src="{{ url_for('static', filename='js/room_rps.js') }}"></script>
    {% endif %}
  </body>
</html>
