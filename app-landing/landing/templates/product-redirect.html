<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }} — NightCraft</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex items-center justify-center">
  <div class="max-w-lg w-full px-6">
    <div class="text-center">
      <h1 class="font-display text-3xl font-semibold text-amber-300 mb-2">{{ name }}</h1>
      <p class="text-stone-400 mb-1">{{ tagline }}</p>
      <p class="text-stone-500 text-sm mb-8">{{ description }}</p>

      {% if is_authenticated %}
        <a href="{{ open_url }}"
           class="inline-block bg-amber-500 hover:bg-amber-400 text-stone-900 font-semibold rounded-lg px-6 py-3">
          Open app
        </a>
        <div class="mt-6">
          <a href="{{ logout_url }}" class="text-stone-500 hover:text-stone-300 text-sm">Sign out</a>
        </div>
      {% else %}
        <a href="{{ open_url }}"
           class="inline-block bg-amber-500 hover:bg-amber-400 text-stone-900 font-semibold rounded-lg px-6 py-3">
          Sign in to open
        </a>
      {% endif %}
    </div>
  </div>
</body>
</html>
