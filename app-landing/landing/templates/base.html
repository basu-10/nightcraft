<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Asesh Basu Projects{% endblock %}</title>
    <meta name="description" content="{% block description %}Landing portal for projects and tools.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="landing-shell">
    <nav class="alfred-navbar" aria-label="Main navigation">
        <div class="alfred-nav-inner">
            <a href="/" class="alfred-logo">Alfred</a>
            <div class="alfred-nav-links">
                <a href="#features">Features</a>
                <a href="#use-cases">Use Cases</a>
                <a href="#pricing">Pricing</a>
                <a href="#privacy">Privacy</a>
                <a href="#docs">Docs</a>
            </div>
            <div class="alfred-nav-actions">
                <a href="{{ auth_url }}" class="alfred-nav-link">Log in</a>
                <a href="{{ register_url }}" class="alfred-nav-cta">Download Alfred</a>
            </div>
        </div>
    </nav>

    <main class="landing-page">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
