# API endpoint test cases
# These are sent through the Flask test client (no real HTTP).
# All requests are authenticated as the test user.

auth:
  cases:
    - id: auth_me
      method: GET
      path: /auth/me
      expect_status: 200
      expect_json_keys: [id, email]

    - id: auth_logout
      method: POST
      path: /auth/logout
      expect_status: 200

    - id: auth_login_bad_password
      method: POST
      path: /auth/login
      body: { email: "test@chotu.test", password: "wrongpassword" }
      expect_status: 401
      authenticated: false

    - id: auth_change_password
      method: POST
      path: /auth/change-password
      body:
        current_password: "testpassword123"
        new_password: "testpassword123" # same — just round-trips
      expect_status: 200

workspaces:
  cases:
    - id: ws_list
      method: GET
      path: /api/workspaces
      expect_status: 200
      expect_json_type: list

    - id: ws_create
      method: POST
      path: /api/workspaces
      body:
        name: "API Test Workspace"
        color: "#FF7F50"
        workspace_type: react
        tool_ids: [web_search, wiki_search]
      expect_status: 201
      expect_json_keys: [id, name, color]

sessions:
  cases:
    - id: session_create
      method: POST
      path: /api/workspaces/__WS_ID__/sessions
      body:
        title: "API Test Session"
      expect_status: 201
      expect_json_keys: [id, title, workspace_id]

admin:
  cases:
    - id: admin_stats
      method: GET
      path: /admin/stats
      expect_status: 200
      expect_json_keys: [user_count, run_count]

    - id: admin_users
      method: GET
      path: /admin/users
      expect_status: 200
      expect_json_type: list

    - id: admin_activity_logs
      method: GET
      path: /admin/activity_logs?limit=10
      expect_status: 200
      expect_json_keys: [total, rows]

profiles:
  cases:
    - id: profile_list
      method: GET
      path: /api/profiles
      expect_status: 200
      expect_json_type: list

    - id: profile_create
      method: POST
      path: /api/profiles
      body:
        name: "Test OR Profile"
        provider: openrouter
        settings:
          api_key: "sk-test"
          agent_model: "openai/gpt-4o-mini"
      expect_status: 201
      expect_json_keys: [id, name, provider]
