# Tool-level unit test cases
# Each section drives a specific tool test.

web_search:
  cases:
    - id: ws_python
      query: "Python programming language"
      min_results: 1
      expect_keys: [title, link, snippet]
      tags: [live]

    - id: ws_openai
      query: "OpenAI GPT-4"
      min_results: 1
      expect_keys: [title, link]
      tags: [live]

wiki_search:
  cases:
    - id: wiki_einstein
      query: "Albert Einstein"
      expect_contains: ["physicist", "relativity"]
      tags: [live]

    - id: wiki_python_lang
      query: "Python programming language"
      expect_contains: ["programming"]
      tags: [live]

visit_url:
  cases:
    - id: visit_example
      url: "https://example.com"
      format: text
      expect_contains: ["Example Domain"]
      tags: [live]

    - id: visit_json
      url: "https://example.com"
      format: json
      expect_keys_in_json: [url, title, text]
      tags: [live]

    - id: visit_invalid
      url: "not-a-url"
      expect_error_prefix: "Error:"
      tags: [unit]

news_search:
  cases:
    - id: news_ai
      query: "artificial intelligence 2025"
      min_results: 1
      tags: [live]

arxiv_search:
  cases:
    - id: arxiv_llm
      query: "large language models"
      min_results: 1
      expect_keys: [title, authors, url]
      tags: [live]

save_text:
  cases:
    - id: save_hello
      filename: "test_output.txt"
      data: "Hello from test harness"
      tags: [unit]
