{% extends "main/base.html" %}

{% block title %}SeekSage | Admin{% endblock %}
{% block page_heading %}Admin{% endblock %}

{% block content %}
  <article class="panel">
    <h2>Overview</h2>
    <div id="admin-error" class="error-text" hidden></div>
    <div class="stats-grid stats-grid-compact">
      <div class="stat-card">
        <h3>Total users</h3>
        <p id="admin-users" class="stat-value">--</p>
      </div>
      <div class="stat-card">
        <h3>Total runs</h3>
        <p id="admin-runs" class="stat-value">--</p>
      </div>
      <div class="stat-card">
        <h3>Runs today</h3>
        <p id="admin-runs-today" class="stat-value">--</p>
      </div>
    </div>
  </article>

  <article class="panel">
    <h2>Create User</h2>
    <form id="admin-create-user-form" class="notes-form">
      <label for="admin-create-email">Email</label>
      <input id="admin-create-email" type="email" required />

      <label for="admin-create-password">Password</label>
      <input id="admin-create-password" type="password" required />

      <label class="checkbox-row" for="admin-create-is-admin">
        <input id="admin-create-is-admin" type="checkbox" />
        Admin
      </label>

      <button type="submit">Create User</button>
    </form>
  </article>

  <article class="panel">
    <h2>Users</h2>
    <div class="table-wrap">
      <table class="notes-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Admin</th>
            <th>Active</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-users-table-body">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </article>

  <script type="module" src="{{ url_for('static', filename='js/seeksage-admin.js') }}"></script>
{% endblock %}
