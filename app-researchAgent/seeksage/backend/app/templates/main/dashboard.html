{% extends "main/base.html" %}

{% block title %}SeekSage | Dashboard{% endblock %}
{% block page_heading %}Dashboard{% endblock %}

{% block content %}
  <div class="stats-grid">
    <article class="stat-card">
      <h2>Total runs</h2>
      <p id="total-runs" class="stat-value">--</p>
    </article>
    <article class="stat-card">
      <h2>Runs today</h2>
      <p id="runs-today" class="stat-value">--</p>
    </article>
    <article class="stat-card stat-card-wide">
      <h2>Top tools</h2>
      <ul id="tool-counts" class="simple-list">
        <li>Loading...</li>
      </ul>
    </article>
    <article class="stat-card stat-card-wide">
      <h2>Workspace activity</h2>
      <ul id="workspace-stats" class="simple-list">
        <li>Loading...</li>
      </ul>
    </article>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/seeksage-dashboard.js') }}"></script>
{% endblock %}
