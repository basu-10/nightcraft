{% extends "main/base.html" %}

{% block title %}SeekSage | Notifications{% endblock %}
{% block page_heading %}Notifications{% endblock %}

{% block content %}
  <article class="panel">
    <h2>Filters</h2>
    <p class="muted">System alerts and tool-cap warnings.</p>

    <div id="notifications-error" class="error-text" hidden></div>

    <div class="form-row-3">
      <label class="checkbox-row" for="unread-only">
        <input id="unread-only" type="checkbox" />
        Unread only
      </label>

      <select id="notification-type">
        <option value="all">All types</option>
        <option value="system">System</option>
        <option value="usage">Usage</option>
        <option value="warning">Warning</option>
      </select>

      <button id="mark-all-read" type="button">Mark all read</button>
    </div>
  </article>

  <article class="panel">
    <h2>Items</h2>
    <div id="notifications-list" class="stack-list">
      <p class="muted">Loading notifications...</p>
    </div>
  </article>

  <script type="module" src="{{ url_for('static', filename='js/seeksage-notifications.js') }}"></script>
{% endblock %}
