{% extends "main/base.html" %}

{% block title %}SeekSage | Account{% endblock %}
{% block page_heading %}Account{% endblock %}

{% block content %}
  <article class="panel">
    <h2>Profile</h2>
    <p class="muted">Current signed-in user details.</p>
    <dl class="detail-list">
      <div><dt>Email</dt><dd id="account-email">Loading...</dd></div>
      <div><dt>Plan</dt><dd>Free</dd></div>
    </dl>
  </article>

  <article class="panel">
    <h2>Usage</h2>
    <div class="stats-grid stats-grid-compact">
      <div class="stat-card">
        <h3>Total runs</h3>
        <p id="account-total-runs" class="stat-value">--</p>
      </div>
      <div class="stat-card">
        <h3>Runs today</h3>
        <p id="account-runs-today" class="stat-value">--</p>
      </div>
    </div>
  </article>

  <article class="panel">
    <h2>Change Password</h2>
    <div id="account-success" class="success-text" hidden></div>
    <div id="account-error" class="error-text" hidden></div>

    <form id="password-form" class="notes-form">
      <label for="current-password">Current password</label>
      <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />

      <label for="new-password">New password</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required />

      <button type="submit">Update Password</button>
    </form>
  </article>

  <script type="module" src="{{ url_for('static', filename='js/seeksage-account.js') }}"></script>
{% endblock %}
