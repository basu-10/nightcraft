[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: run unit + integration tests; skip live (network) and slow tests
# Override with: pytest -m live   or  pytest -m "live or slow"
addopts =
    -v
    --tb=short
    --timeout=180
    --strict-markers
    -p no:warnings

markers =
    unit:        Fast isolated tests with no network or DB (no dep on Flask app)
    integration: Tests requiring the full Flask app context and in-memory DB
    live:        Tests that call real external APIs (OpenRouter, DuckDuckGo, arXiv)
    slow:        Tests that take more than 30 seconds

# Show 20 slowest tests
# (install pytest-durations or use --durations=20 flag)
