{% extends "base.html" %}
{% block title %}Sign in — Alfred{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <label>Username<input type="text" name="username" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
  <p><a href="{{ url_for('auth.register') }}">Create an account</a></p>
  {% if has_admin_login %}<p><a href="{{ admin_login_url }}">Admin sign in</a></p>{% endif %}
</div>
{% endblock %}
