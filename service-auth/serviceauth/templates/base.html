<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Service Auth{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% if not config.get('TELEMETRY_DISABLED') %}
  <script>
    window.__TELEMETRY__ = {
      endpoint: {{ config.TELEMETRY_ENDPOINT | tojson }},
      userId: {{ session.get('user_id') if session.get('user_id') else 'null' }}
    };
  </script>
  <script defer src="{{ url_for('static', filename='telemetry-sdk.js') }}"></script>
  {% endif %}
  </head>
  <body>
    <div class="bg-layer"></div>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-wrap">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
