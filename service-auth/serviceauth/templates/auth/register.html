{% extends 'base.html' %}
{% block title %}Register | Service Auth{% endblock %}
{% block content %}
<section class="card narrow auth-card">
  <p class="live-badge"><span class="live-dot"></span> Shared Account</p>
  <h1>Create Account</h1>
  <p class="subtle">Only username, email, password, and timezone are persisted. Empty username or email values are auto-filled.</p>

  <form method="post" class="form-grid auth-form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Username
      <input name="username" type="text" value="{{ form_values.get('username', '') }}" placeholder="username">
    </label>
    <label>Email
      <input name="email" type="email" value="{{ form_values.get('email', '') }}" placeholder="email">
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <label>Timezone
      <input name="timezone_name" type="text" value="{{ form_values.get('timezone_name', default_timezone) }}" placeholder="Asia/Kolkata">
    </label>
    <button type="submit">Create account</button>
  </form>

  <div class="button-row auth-actions">
    <a href="{{ url_for('core.login', next=next_url) }}">Back to login</a>
  </div>
</section>
{% endblock %}
