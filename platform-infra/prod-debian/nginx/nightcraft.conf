# Nginx reverse proxy for Nightcraft stack (landing + auth + radio + admin).
# Copy to /etc/nginx/sites-available/nightcraft.conf and enable via symlink.

upstream app_landing_upstream {
    server 127.0.0.1:5400;
    keepalive 32;
}

upstream app_radio_upstream {
    server 127.0.0.1:5333;
    keepalive 32;
}

upstream app_admin_upstream {
    server 127.0.0.1:5500;
    keepalive 32;
}

upstream app_neera_upstream {
    server 127.0.0.1:5600;
    keepalive 32;
}

upstream app_seeksage_upstream {
    server 127.0.0.1:5700;
    keepalive 32;
}

upstream service_auth_upstream {
    server 127.0.0.1:5100;
    keepalive 32;
}

upstream app_game_upstream {
    server 127.0.0.1:5800;
    keepalive 32;
}

upstream app_note_upstream {
    server 127.0.0.1:5900;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 31.70.85.89;

    client_max_body_size 20m;

    location = /auth {
        return 301 /auth/;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Central admin hub (app-landing) served under /platform-admin.
    # Use a single prefix location (no trailing slash) so the bare
    # /platform-admin path and /platform-admin/<subpath> hit the SAME backend.
    # A stale split between an exact "location = /platform-admin" and a
    # "location /platform-admin/" prefix previously routed the bare path to an
    # old backend whose nav links pointed at /users and /logs (which 404).
    location = /platform-admin/ {
        return 302 /platform-admin;
    }

    location /platform-admin {
        proxy_pass http://app_landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location = /devradio {
        return 301 /devradio/;
    }

    location = /neera {
        return 301 /neera/;
    }

    location = /seeksage {
        return 301 /seeksage/;
    }

    location = /game {
        return 301 /game/;
    }

    location = /notestack {
        return 301 /notestack/;
    }

    location /auth/ {
        proxy_pass http://service_auth_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /admin/ {
        proxy_pass http://app_admin_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /devradio/ {
        proxy_pass http://app_radio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devradio;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /neera/ {
        proxy_pass http://app_neera_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /neera;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /seeksage/ {
        proxy_pass http://app_seeksage_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /seeksage;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /game/ {
        proxy_pass http://app_game_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
    }

    location /notestack/ {
        proxy_pass http://app_note_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /notestack;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location / {
        proxy_pass http://app_landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 444;
}
