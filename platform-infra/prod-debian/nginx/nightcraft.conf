# Nginx reverse proxy for Nightcraft stack (landing + auth + radio + admin).
# Copy to /etc/nginx/sites-available/nightcraft.conf and enable via symlink.

upstream app_landing_upstream {
    server 127.0.0.1:5400;
    keepalive 32;
}

upstream app_radio_upstream {
    server 127.0.0.1:5333;
    keepalive 32;
}

upstream app_admin_upstream {
    server 127.0.0.1:5500;
    keepalive 32;
}

upstream app_neera_upstream {
    server 127.0.0.1:5600;
    keepalive 32;
}

upstream app_quickposts_upstream {
    server 127.0.0.1:5310;
    keepalive 32;
}

upstream app_noteflow_upstream {
    server 127.0.0.1:5320;
    keepalive 32;
}

upstream app_scratchpad_upstream {
    server 127.0.0.1:5330;
    keepalive 32;
}

upstream service_auth_upstream {
    server 127.0.0.1:5100;
    keepalive 32;
}

upstream app_game_upstream {
    server 127.0.0.1:5800;
    keepalive 32;
}

upstream app_note_upstream {
    server 127.0.0.1:5900;
    keepalive 32;
}

upstream app_pledge_upstream {
    server 127.0.0.1:5300;
    keepalive 32;
}

upstream app_alfred_upstream {
    server 127.0.0.1:5950;
    keepalive 32;
}

upstream app_tinyxl_upstream {
    server 127.0.0.1:5200;
    keepalive 32;
}

# Runtime Manager (owns on_demand product lifecycles).
upstream nightcraft_runtime_manager_upstream {
    server 127.0.0.1:5700;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name 31.70.85.89;

    client_max_body_size 20m;

    # On-demand / generated product blocks (Green Pledge, etc.).
    # Generated by gen-nginx-on-demand.sh from products.yml.
    include /etc/nginx/sites-include/on-demand.conf;

    location = /auth {
        return 301 /auth/;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Central admin hub (app-landing) served under /platform-admin.
    # Use a single prefix location (no trailing slash) so the bare
    # /platform-admin path and /platform-admin/<subpath> hit the SAME backend.
    # A stale split between an exact "location = /platform-admin" and a
    # "location /platform-admin/" prefix previously routed the bare path to an
    # old backend whose nav links pointed at /users and /logs (which 404).
    location = /platform-admin/ {
        return 302 /platform-admin;
    }

    location /platform-admin {
        proxy_pass http://app_landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location = /devradio {
        return 301 /devradio/;
    }

    location = /game {
        return 301 /game/;
    }

    location = /notestack {
        return 301 /notestack/;
    }

    location = /tinyxl {
        return 301 /tinyxl/;
    }

    location /auth/ {
        proxy_pass http://service_auth_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /admin/ {
        proxy_pass http://app_admin_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /devradio/ {
        proxy_pass http://app_radio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devradio;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /game/ {
        proxy_pass http://app_game_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /game;
        proxy_set_header Connection "";
        # No SSE streaming anymore: the game uses lightweight client polling.
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
        # ROM uploads (EmulatorJS) can be large.
        client_max_body_size 64m;
    }

    location /notestack/ {
        proxy_pass http://app_note_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /notestack;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location /tinyxl/ {
        proxy_pass http://app_tinyxl_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tinyxl;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location / {
        proxy_pass http://app_landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 444;
}
