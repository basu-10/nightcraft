<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading&hellip; | Nightcraft</title>
  <style>
    :root {
      --bg: #0b1410;
      --fg: #e8f5e9;
      --accent: #4caf50;
      --muted: #8bbf96;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      text-align: center;
      padding: 2rem;
    }

    /* floating drifting dots in the background */
    .bg-dots { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .bg-dots span {
      position: absolute;
      bottom: -20px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.18;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.22; }
      90% { opacity: 0.22; }
      100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
    }

    .stage { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 1.75rem; }

    /* bouncing critter made of dots */
    .critter {
      width: 96px; height: 64px;
      position: relative;
      animation: hop 1.1s ease-in-out infinite;
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-18px); }
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(76,175,80,0.45);
    }
    .bubble.b1 { width: 26px; height: 26px; left: 8px;  top: 22px; animation: pulse 1.1s ease-in-out infinite; }
    .bubble.b2 { width: 34px; height: 34px; left: 31px; top: 14px; animation: pulse 1.1s ease-in-out .15s infinite; }
    .bubble.b3 { width: 22px; height: 22px; left: 64px; top: 26px; animation: pulse 1.1s ease-in-out .3s infinite; }
    .eye {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--bg);
      z-index: 2;
    }
    .eye.e1 { left: 40px; top: 26px; }
    .eye.e2 { left: 54px; top: 26px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.82); opacity: 0.8; }
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .loading-text {
      color: var(--muted);
      margin: 0;
      font-size: 1.05rem;
      min-height: 1.4em;
      transition: opacity 0.25s ease;
    }
    .loading-text .dots::after {
      content: "";
      animation: ellipsis 1.2s steps(4, end) infinite;
    }
    @keyframes ellipsis {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

    .bar {
      width: 240px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #81c784);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    .footer {
      position: fixed;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      color: var(--muted);
      opacity: 0.5;
      font-size: 0.78rem;
      z-index: 1;
    }

    /* click ripple */
    .ripple {
      position: fixed;
      border: 2px solid rgba(76,175,80,0.55);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      animation: rippleOut 0.7s ease-out forwards;
    }
    @keyframes rippleOut {
      0% { width: 0; height: 0; opacity: 0.7; }
      100% { width: 160px; height: 160px; opacity: 0; }
    }

    /* cursor-following critter */
    .critter {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      .ripple { animation-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <div class="bg-dots" id="bgDots" aria-hidden="true"></div>

  <div class="stage">
    <div class="critter" aria-hidden="true">
      <span class="bubble b1"></span>
      <span class="bubble b2"></span>
      <span class="bubble b3"></span>
      <span class="eye e1"></span>
      <span class="eye e2"></span>
    </div>

    <h1 id="title">Just a moment&hellip;</h1>
    <p class="loading-text" id="status">Getting things ready<span class="dots"></span></p>

    <div class="bar"><span></span></div>
  </div>

  <div class="footer">Nightcraft</div>

  <script>
    // ?slug=<slug>&next=<original-request-uri>
    // `next` is the LAST query parameter and may itself contain ? and &, so we
    // parse it as the trailing value rather than via URLSearchParams.
    (function () {
      var raw = window.location.search.replace(/^\?/, "");
      var slug = "";
      var next = "/";
      var params = raw.split("&");
      for (var i = 0; i < params.length; i++) {
        var kv = params[i].split("=");
        if (kv[0] === "slug") {
          slug = decodeURIComponent(kv[1] || "");
        } else if (kv[0] === "next") {
          // Everything after "next=" is the destination, even if it has & or ?.
          next = decodeURIComponent(raw.slice(raw.indexOf("next=") + 5));
        }
      }

      // --- fun, nonsensical loading messages (never mention on-demand / cold start) ---
      var messages = [
        "Munching bytes",
        "Running tests with otters",
        "Filing taxes for the server gnomes",
        "Teaching ducks to type",
        "Brushing the digital cat",
        "Convincing the hamster to keep running",
        "Polishing pixels to a mirror shine",
        "Negotiating with the rubber duck",
        "Untangling spaghetti code, one noodle at a time",
        "Summoning the snacking spirits",
        "Counting to potato",
        "Bribing the load balancer with cookies",
        "Aligning the cosmic cogs",
        "Warming up the jazz hands",
        "Defragmenting the chaos",
        "Brewing a fresh pot of logic",
        "Herding stray semicolons",
        "Charging the flux capacitor",
        "Asking the crystal ball politely",
        "Reticulating splines",
        "Spinning up the confetti cannon",
        "Waking the sleepy databases",
        "Boosting morale of the background threads",
        "Petting the mainframe",
        "Downloading more RAM, just in case"
      ];

      var statusEl = document.getElementById("status");
      var idx = Math.floor(Math.random() * messages.length);
      function rotateMessage() {
        statusEl.style.opacity = "0";
        setTimeout(function () {
          idx = (idx + 1) % messages.length;
          statusEl.innerHTML = messages[idx] + '<span class="dots"></span>';
          statusEl.style.opacity = "1";
        }, 250);
      }
      statusEl.innerHTML = messages[idx] + '<span class="dots"></span>';
      var msgTimer = setInterval(rotateMessage, 2600);

      // --- drifting background dots ---
      var bg = document.getElementById("bgDots");
      var dotEls = [];
      for (var d = 0; d < 18; d++) {
        var s = document.createElement("span");
        s.style.left = Math.random() * 100 + "vw";
        var size = 4 + Math.random() * 10;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.animationDuration = (8 + Math.random() * 12) + "s";
        s.style.animationDelay = (-Math.random() * 12) + "s";
        bg.appendChild(s);
        dotEls.push(s);
      }

      // --- passive interactivity -------------------------------------------------
      var reduceMotion = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var stageEl = document.querySelector(".stage");
      var pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      var alive = true; // set false once we redirect, to stop the rAF loop

      // critter + stage lean gently toward the pointer
      if (!reduceMotion) {
        window.addEventListener("pointermove", function (e) {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
        }, { passive: true });

        (function followLoop() {
          if (!alive) return;
          var cx = window.innerWidth / 2;
          var cy = window.innerHeight / 2;
          var dx = (pointer.x - cx) / cx; // -1 .. 1
          var dy = (pointer.y - cy) / cy;
          stageEl.style.transform =
            "translate(" + (dx * 18).toFixed(1) + "px," + (dy * 14).toFixed(1) + "px)";
          requestAnimationFrame(followLoop);
        })();
      }

      // background dots drift away from the pointer (parallax-ish parting)
      function repelDots() {
        if (!alive || reduceMotion) return;
        var px = pointer.x, py = pointer.y;
        for (var i = 0; i < dotEls.length; i++) {
          var el = dotEls[i];
          var r = el.getBoundingClientRect();
          var ex = r.left + r.width / 2;
          var ey = r.top + r.height / 2;
          var dist = Math.hypot(ex - px, ey - py);
          if (dist < 120) {
            var ang = Math.atan2(ey - py, ex - px);
            var push = (120 - dist) / 120 * 22;
            el.style.marginLeft = Math.cos(ang) * push + "px";
            el.style.marginTop = Math.sin(ang) * push + "px";
          } else if (el.style.marginLeft !== "0px") {
            el.style.marginLeft = "0px";
            el.style.marginTop = "0px";
          }
        }
        requestAnimationFrame(repelDots);
      }
      if (!reduceMotion) repelDots();

      // tap / click spawns a ripple
      function spawnRipple(x, y) {
        var r = document.createElement("span");
        r.className = "ripple";
        r.style.left = x + "px";
        r.style.top = y + "px";
        document.body.appendChild(r);
        setTimeout(function () {
          if (r.parentNode) r.parentNode.removeChild(r);
        }, 750);
      }
      window.addEventListener("pointerdown", function (e) {
        spawnRipple(e.clientX, e.clientY);
      }, { passive: true });

      if (!slug) {
        clearInterval(msgTimer);
        document.getElementById("title").textContent = "Something went wrong";
        statusEl.textContent = "This page was opened without the info it needs.";
        return;
      }

      // Hard ceiling: after this many ms, stop polling and let the user retry.
      // Prevents an infinite spinner if the backend never comes up.
      var HARD_TIMEOUT_MS = 120000;
      var startedAt = Date.now();
      var gaveUp = false;

      function giveUp(reason) {
        if (gaveUp) return;
        gaveUp = true;
        alive = false;
        clearInterval(msgTimer);
        document.getElementById("title").textContent = "We couldn't start this app";
        statusEl.innerHTML = (reason ||
          "The service didn't become ready in time. It may have failed to start.") +
          ' <a href="#" id="retryLink" style="color:var(--accent)">Try again</a>';
        var retry = document.getElementById("retryLink");
        if (retry) {
          retry.addEventListener("click", function (e) {
            e.preventDefault();
            retryNow();
          });
        }
      }

      function retryNow() {
        // Re-running the probe re-mirrors /_nc_touch_<slug>, which asks the
        // manager to re-attempt `systemctl start` (a failed start clears its
        // in-progress guard, so a fresh touch retries). Reload to begin fresh.
        window.location.reload();
      }

      function poll() {
        if (gaveUp) return;
        var url = "/_nc_probe/" + encodeURIComponent(slug) +
          "?t=" + Date.now();
        fetch(url, { cache: "no-store" })
          .then(function (resp) {
            if (resp.ok) {
              alive = false;
              clearInterval(msgTimer);
              statusEl.textContent = "All set! Taking you in…";
              window.location.href = next;
              return;
            }
            // Not ready yet: ask the manager whether the start failed, so we
            // can stop spinning forever on a crashed service.
            fetch("/_nc_status/" + encodeURIComponent(slug) + "?t=" + Date.now(),
              { cache: "no-store" })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (st) {
                if (st && st.status === "failed") {
                  var why = st.error ? (" (" + st.error + ")") : "";
                  giveUp("The service failed to start" + why +
                    ". You can retry, or contact support if it keeps failing.");
                  return;
                }
                if (Date.now() - startedAt > HARD_TIMEOUT_MS) {
                  giveUp();
                  return;
                }
                setTimeout(poll, 1500);
              })
              .catch(function () {
                if (Date.now() - startedAt > HARD_TIMEOUT_MS) {
                  giveUp();
                  return;
                }
                setTimeout(poll, 1500);
              });
          })
          .catch(function () {
            if (Date.now() - startedAt > HARD_TIMEOUT_MS) {
              giveUp();
              return;
            }
            setTimeout(poll, 1500);
          });
      }

      // Give the manager a moment to react to the probe's own mirror touch.
      setTimeout(poll, 800);
    })();
  </script>
</body>
</html>
