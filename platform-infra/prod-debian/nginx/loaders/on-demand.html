<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starting&hellip; | Nightcraft</title>
  <style>
    :root {
      --bg: #0b1410;
      --fg: #e8f5e9;
      --accent: #4caf50;
      --muted: #8bbf96;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
      padding: 2rem;
    }
    .leaf {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
    p { color: var(--muted); margin: 0; font-size: 0.95rem; }
    .bar {
      width: 220px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="leaf" aria-hidden="true"></div>
  <h1 id="title">Warming up the service&hellip;</h1>
  <div class="bar"><span></span></div>
  <p id="status">This page will redirect automatically once the app is ready.</p>

  <script>
    // ?slug=<slug>&next=<original-request-uri>
    // `next` is the LAST query parameter and may itself contain ? and &, so we
    // parse it as the trailing value rather than via URLSearchParams.
    (function () {
      var raw = window.location.search.replace(/^\?/, "");
      var slug = "";
      var next = "/";
      var params = raw.split("&");
      for (var i = 0; i < params.length; i++) {
        var kv = params[i].split("=");
        if (kv[0] === "slug") {
          slug = decodeURIComponent(kv[1] || "");
        } else if (kv[0] === "next") {
          // Everything after "next=" is the destination, even if it has & or ?.
          next = decodeURIComponent(raw.slice(raw.indexOf("next=") + 5));
        }
      }

      if (!slug) {
        document.getElementById("title").textContent = "Missing service slug";
        document.getElementById("status").textContent =
          "The loading page was opened without a ?slug= parameter.";
        return;
      }

      var title = document.getElementById("title");
      var status = document.getElementById("status");
      title.textContent = "Starting " + slug + "…";
      status.textContent = "First request triggers a cold start; this can take up to a minute.";

      function poll() {
        var url = "/_nc_probe/" + encodeURIComponent(slug) +
          "?t=" + Date.now();
        fetch(url, { cache: "no-store" })
          .then(function (resp) {
            if (resp.ok) {
              status.textContent = "Ready! Redirecting…";
              window.location.href = next;
              return;
            }
            setTimeout(poll, 1500);
          })
          .catch(function () {
            setTimeout(poll, 1500);
          });
      }

      // Give the manager a moment to react to the probe's own mirror touch.
      setTimeout(poll, 800);
    })();
  </script>
</body>
</html>
