{% extends "base.html" %}
{% block title %}Sign in &mdash; The Green Pledge{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>{{ 'Admin Login' if mode == 'admin' else 'Member Login' }}</h1>
  <form method="post" action="{{ request.path }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <label>
      Username
      <input type="text" name="username" autocomplete="username" required>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
  {% if mode != 'admin' %}
  <p class="alt-link">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
  {% endif %}
</section>
{% endblock %}
