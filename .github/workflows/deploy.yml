name: Deploy Nightcraft

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Run deployment script on IONOS VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            TMP_BOOTSTRAP="/tmp/nightcraft-server-bootstrap.sh"
            curl -fsSL https://raw.githubusercontent.com/basu-10/nightcraft/main/server-scripts/nightcraft-server-bootstrap.sh -o "${TMP_BOOTSTRAP}"
            sudo install -d -m 0755 /usr/local/sbin/server-scripts
            sudo install -m 0755 "${TMP_BOOTSTRAP}" /usr/local/sbin/server-scripts/nightcraft-server-bootstrap.sh
            sudo /usr/local/sbin/server-scripts/nightcraft-server-bootstrap.sh \
              --repo-url https://github.com/basu-10/nightcraft.git \
              --branch main \
              --target-dir /platform-infra \
              --adopt-existing \
              --force-sync
