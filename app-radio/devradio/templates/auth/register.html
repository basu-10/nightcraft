{% extends 'base.html' %}
{% block title %}Register | DevRadio{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create Listener Account</h1>
  <form method="post" class="form-grid">
    <label>Username
      <input name="username" type="text" required>
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <label>Timezone
      <input name="timezone_name" type="text" value="Asia/Kolkata" required>
    </label>
    <button type="submit">Register</button>
  </form>
</section>
{% endblock %}
